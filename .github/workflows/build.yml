name: Build QuickNotesPanel dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile iOS Tweak
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickNotesPanel-dylib
          path: dist/QuickNotesPanel.dylib
          if-no-files-found: error
